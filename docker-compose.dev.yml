# Postgres para desarrollo y tests. Solo escucha en 127.0.0.1 (no expuesto a la red local).
services:
  db:
    image: postgres:17-alpine
    container_name: coach-db-dev
    # Q1: estadísticas de consultas (tools/slow-queries.mjs) y las de más de 200 ms en el log del contenedor.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top", "-c", "log_min_duration_statement=200", "-c", "log_parameter_max_length=0"]
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
      POSTGRES_DB: coach
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - coach-db-dev:/var/lib/postgresql/data
      - ./tools/dev-db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  coach-db-dev:
